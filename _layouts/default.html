<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae - {{ site.contact.name }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    <!-- Open Graph -->
    <meta property="og:title" content="Curriculum Vitae - {{ site.contact.name }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
    <meta property="og:type" content="website">

    <!-- Include Font Awesome -->
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/all.min.css" crossorigin="anonymous"
        referrerpolicy="no-referrer" />
    <!-- Include main CSS -->
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon.png">
</head>

<body>
    <main class="container" role="main">
        {% include contact.html %}
        <!-- {% include about.html %} -->
        {% include appointments.html %}
        {% include education.html %}
        {% include research.html %}
        {% include publications.html %}
        {% include conferences.html %}
        {% include honors.html %}
        {% include footer.html %}
    </main>
</body>

</html>
